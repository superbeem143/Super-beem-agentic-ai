<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPER BEEM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">
    🤖 <span>SUPER BEEM</span>
  </div>

  <div class="status">
    <span class="online"></span>
    ONLINE
  </div>
</header>

<main>

  <section class="chat-panel">

    <h2>SUPER BEEM</h2>

    <div id="chatBox">

      <div class="bot">
        👋 Hello Boss!
      </div>

      <div class="bot">
        I am SUPER BEEM.
      </div>

      <div class="bot">
        Ready for your command...
      </div>

    </div>

    <div class="input-area">

      <input
        id="prompt"
        type="text"
        placeholder="Type your command..."
      >

      <button id="sendBtn">
        Send
      </button>

    </div>

  </section>

  <section class="side-panel">

    <h3>Agent Status</h3>

    <ul>

      <li>🧠 Brain : Online</li>

      <li>📂 Project : Ready</li>

      <li>⚡ Agent : Idle</li>

      <li>💻 GitHub : Not Connected</li>

      <li>🔥 Firebase : Not Connected</li>

    </ul>

  </section>

</main>

<script src="script.js"></script>

</body>
</html>
