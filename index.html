<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SUPER BEEM AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

header{
background:#ff9800;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:12px;
}

.user{
align-self:flex-end;
background:#2196f3;
padding:12px 16px;
border-radius:18px 18px 0 18px;
max-width:80%;
word-wrap:break-word;
}

.bot{
align-self:flex-start;
background:#333;
padding:12px 16px;
border-radius:18px 18px 18px 0;
max-width:80%;
word-wrap:break-word;
}

.bottom{
display:flex;
padding:10px;
background:#222;
}

#msg{
flex:1;
padding:14px;
border:none;
outline:none;
border-radius:8px;
font-size:16px;
}

button{
margin-left:8px;
padding:14px 18px;
background:#ff9800;
border:none;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#ffb300;
}

</style>

</head>

<body>

<header>🤖 SUPER BEEM AI</header>

<div id="chat"></div>

<div class="bottom">

<input
id="msg"
placeholder="Ask anything...">

<button onclick="startVoice()">🎤</button>

<button onclick="send()">Send</button>

</div>

<script>

const SERVER="https://super-beem-server.onrender.com/chat";

const chat=document.getElementById("chat");
const input=document.getElementById("msg");async function send(){

const message=input.value.trim();

if(message==="") return;

chat.innerHTML+=`
<div class="user">${message}</div>
`;

chat.scrollTop=chat.scrollHeight;

input.value="";

try{

const res=await fetch(SERVER,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:message
})
});

const data=await res.json();

chat.innerHTML+=`
<div class="bot">${data.reply}</div>
`;

chat.scrollTop=chat.scrollHeight;

// AI Voice Reply
const speech=new SpeechSynthesisUtterance(data.reply);
speech.lang="en-US";
speechSynthesis.speak(speech);

}catch(err){

chat.innerHTML+=`
<div class="bot">❌ ${err.message}</div>
`;

}

}

input.addEventListener("keypress",function(e){
if(e.key==="Enter"){
send();
}
});
async function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Voice recognition is not supported.");
        return;
    }

    try {
        await navigator.mediaDevices.getUserMedia({ audio: true });

        const recognition = new SpeechRecognition();

        recognition.lang = "en-US";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = function (event) {
            input.value = event.results[0][0].transcript;
            send();
        };

        recognition.onerror = function (event) {
            if (event.error === "not-allowed") {
                alert("Please allow microphone permission in your browser.");
            } else {
                alert("Voice Error: " + event.error);
            }
        };

        recognition.start();

    } catch (err) {
        alert("Microphone permission denied.");
    }
}

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("Voice recognition is not supported.");
return;
}

const recognition = new SpeechRecognition();

recognition.lang = "en-US"; // Telugu కోసం "te-IN"
recognition.interimResults = false;
recognition.maxAlternatives = 1;

recognition.onresult = function(event){

input.value = event.results[0][0].transcript;

send();

};

recognition.onerror = function(event){

alert("Voice Error: " + event.error);

};

recognition.start();

}
</script>

</body>
</html>
