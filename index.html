<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SUPER BEEM AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

header{
background:#ff9800;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.user{
display:flex;
justify-content:flex-end;
margin:10px 0;
}

.user span{
background:#2196F3;
padding:12px;
border-radius:12px;
max-width:80%;
}

.bot{
display:flex;
justify-content:flex-start;
margin:10px 0;
}

.bot span{
background:#333;
padding:12px;
border-radius:12px;
max-width:80%;
}

.bottom{
display:flex;
padding:10px;
background:#222;
}

#msg{
flex:1;
padding:14px;
font-size:16px;
border:none;
outline:none;
border-radius:8px;
}

button{
margin-left:8px;
padding:14px 20px;
background:#ff9800;
border:none;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<header>🤖 SUPER BEEM AI</header>

<div id="chat"></div>

<div class="bottom">

<input
id="msg"
placeholder="Ask anything...">

<button onclick="startVoice()">🎤</button>

<button onclick="send()">Send</button>

</div>

<script> 
function startVoice(){

const recognition =
new (window.SpeechRecognition ||
window.webkitSpeechRecognition)();

recognition.lang = "en-US";
// తెలుగు కావాలంటే:
// recognition.lang = "te-IN";

recognition.start();

recognition.onresult = function(event){

document.getElementById("msg").value =
event.results[0][0].transcript;

send();

};

recognition.onerror = function(){

alert("Microphone permission denied or browser doesn't support voice.");

};

}

const SERVER =
"https://super-beem-server.onrender.com/chat";

const chat =
document.getElementById("chat");

const input =
document.getElementById("msg");

async function send(){

const message =
input.value.trim();

if(message==="") return;

chat.innerHTML +=
`<div class="user"><span>${message}</span></div>`;

chat.scrollTop = chat.scrollHeight;

input.value = "";

try{

const res = await fetch(SERVER,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:message
})
});

const data = await res.json();
    chat.innerHTML +=
`<div class="bot"><span>${data.reply}</span></div>`;

chat.scrollTop = chat.scrollHeight;

// AI Voice Reply
const speech =
new SpeechSynthesisUtterance(data.reply);

speech.lang = "en-US";
speech.rate = 1;
speech.pitch = 1;

speechSynthesis.cancel();
speechSynthesis.speak(speech);

}catch(err){

chat.innerHTML +=
`<div class="bot"><span>❌ ${err.message}</span></div>`;

chat.scrollTop = chat.scrollHeight;

}

}

input.addEventListener("keypress",function(e){

if(e.key==="Enter"){
send();
}

});

</body>
</html>
