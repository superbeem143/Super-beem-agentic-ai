<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER BEEM AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
display:flex;
flex-direction:column;
height:100vh;
}

header{
background:#ff9800;
padding:18px;
text-align:center;
font-size:26px;
font-weight:bold;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.user{
text-align:right;
margin:10px 0;
}

.user span{
display:inline-block;
background:#2196f3;
padding:10px 14px;
border-radius:12px;
max-width:80%;
}

.bot{
text-align:left;
margin:10px 0;
}

.bot span{
display:inline-block;
background:#333;
padding:10px 14px;
border-radius:12px;
max-width:80%;
}

.bottom{
display:flex;
padding:10px;
background:#222;
}

#msg{
flex:1;
padding:14px;
font-size:16px;
border:none;
outline:none;
border-radius:8px;
}

button{
margin-left:8px;
padding:14px 20px;
background:#ff9800;
border:none;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<header>🤖 SUPER BEEM AI</header>

<div id="chat"></div>

<div class="bottom">
<input id="msg" placeholder="Ask anything...">
<button onclick="startVoice()">🎤</button>
<button onclick="send()">Send</button>
</div>

<script>

const SERVER="https://super-beem-server.onrender.com/chat";

const chat=document.getElementById("chat");
const input=document.getElementById("msg");
    async function send(){

const message=input.value.trim();

if(message==="") return;

chat.innerHTML+=`<div class="user"><span>${message}</span></div>`;
chat.scrollTop=chat.scrollHeight;

input.value="";

try{

const res=await fetch(SERVER,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:message
})
});

const data=await res.json();

chat.innerHTML+=`<div class="bot"><span>${data.reply || data.error || "No response"}</span></div>`;
chat.scrollTop=chat.scrollHeight;

}catch(err){

chat.innerHTML+=`<div class="bot"><span>❌ Server Error</span></div>`;
chat.scrollTop=chat.scrollHeight;

}

}

</script>

</body>
</html>
